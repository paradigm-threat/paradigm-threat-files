<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="110mm" height="48mm" viewBox="0 0 110 48">
  <title>ECW Card Slice edge profile + rail front callout</title>
  <defs>
    <style>
      .body { fill: #2a2a2a; stroke: #111; stroke-width: 0.3; }
      .coin-layer { fill: #444; stroke: #555; stroke-width: 0.2; }
      .rail-side { fill: #3a3a3a; stroke: #222; stroke-width: 0.25; }
      .rail-front { fill: #333; stroke: #555; stroke-width: 0.25; }
      .display { fill: #0a0a0a; stroke: #666; stroke-width: 0.2; }
      .halo { fill: none; stroke: #88ccff; stroke-width: 0.5; }
      .wheel { fill: #555; stroke: #999; stroke-width: 0.25; }
      .callout { fill: none; stroke: #666; stroke-width: 0.2; stroke-dasharray: 1 0.8; }
      .label { font-family: sans-serif; font-size: 2px; fill: #aaa; }
      .dim { font-family: sans-serif; font-size: 1.8px; fill: #777; }
      .title { font-family: sans-serif; font-size: 2.5px; fill: #ccc; font-weight: bold; }
      .panel-title { font-family: sans-serif; font-size: 2px; fill: #88ccff; }
      .warn { font-family: sans-serif; font-size: 2px; fill: #f96; }
    </style>
  </defs>

  <text class="title" x="2" y="4">ECW Card Slice edge profile ~5.5 mm thick</text>

  <!-- Panel A: side elevation (102 mm long) -->
  <g id="side_elevation" transform="translate(5, 8)">
    <text class="panel-title" x="0" y="-1.5">A · side elevation</text>
    <rect class="body" x="0" y="0" width="84" height="5.5" rx="0.4"/>
    <rect class="coin-layer" x="1" y="1.6" width="82" height="2.3" rx="0.2"/>
    <rect class="rail-side" x="84" y="0" width="18" height="5.5" rx="0.4"/>
    <text class="dim" x="30" y="4.2">coin layer 2.3 mm</text>
    <text class="dim" x="0" y="8.5">tray 84 mm</text>
    <text class="dim" x="86" y="8.5">rail 18 mm</text>
    <line class="callout" x1="93" y1="5.5" x2="93" y2="11"/>
  </g>

  <!-- Panel B: rail front callout (18 mm wide, stacked controls) -->
  <g id="rail_front" transform="translate(86, 19)">
    <text class="panel-title" x="0" y="-1.5">B · rail front (detail)</text>
    <rect class="rail-front" x="0" y="0" width="18" height="26" rx="0.5"/>

    <g id="display" transform="translate(2, 1.5)">
      <text class="dim" x="0" y="-0.8">BILL+ halo</text>
      <rect class="halo" x="-0.5" y="0" width="15" height="5.5" rx="0.8"/>
      <rect class="display" x="0" y="0.5" width="14" height="4.5" rx="0.4"/>
      <text x="1" y="3.8" font-family="monospace" font-size="2.5" fill="#33ff66">20.24</text>
    </g>

    <g id="wheel_int" transform="translate(9, 12)">
      <text class="dim" x="-7" y="-4.5">INT</text>
      <circle class="wheel" cx="0" cy="0" r="3.5"/>
      <circle cx="0" cy="0" r="2.5" fill="none" stroke="#777" stroke-width="0.25"/>
      <line x1="0" y1="-3.5" x2="0" y2="-2.2" stroke="#aaa" stroke-width="0.35"/>
      <text class="label" x="0" y="5.5" text-anchor="middle">$</text>
      <text class="dim" x="0" y="1.2" text-anchor="middle" font-size="1.5">0-99</text>
    </g>

    <g id="wheel_cent" transform="translate(9, 21)">
      <text class="dim" x="-7" y="-4.5">cent</text>
      <circle class="wheel" cx="0" cy="0" r="3.5"/>
      <circle cx="0" cy="0" r="2.5" fill="none" stroke="#777" stroke-width="0.25"/>
      <line x1="0" y1="-3.5" x2="0" y2="-2.2" stroke="#aaa" stroke-width="0.35"/>
      <text class="label" x="0" y="5.5" text-anchor="middle">c</text>
      <text class="dim" x="0" y="1.2" text-anchor="middle" font-size="1.5">0-99</text>
    </g>
  </g>

  <!-- Legend: below both panels, full width -->
  <g id="legend" transform="translate(5, 44)">
    <text class="label" x="0" y="0">Stack top to bottom: display + bill halo, $ wheel (0-99), cent wheel (0-99)</text>
    <text class="warn" x="0" y="3">Rotary wheels — NOT linear slide switches. No GO button.</text>
  </g>
</svg>
