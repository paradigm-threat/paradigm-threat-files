# Injected / maintained for relay fleet pre-receive (thin files tip).
# Thin: no binaries; IPFS stubs. UI is in-repo CleverScript (client + server get).
name: "Paradigm Threat Files"
version: "0.1.0"
description: "Thin files corpus with in-repo CleverScript site shell"
client:
  hooks:
    get:
      path: hooks/client/get.jsx
server:
  hooks:
    get:
      path: hooks/server/get.cs
    index:
      path: hooks/server/index.cs
    query:
      path: hooks/server/query.cs
    mcp:
      path: hooks/server/mcp.cs
  search:
    plugin: sqlite
  tls:
    plugin: park
git:
  autoPush:
    branches: ["main"]
    originList:
      - "dfw1.relaygateway.net"
      - "lon1.relaygateway.net"
      - "hkg1.relaygateway.net"
    debounceSeconds: 2
  branchRules:
    default:
      requireSigned: false
      allowUnsigned: true
    branches:
      - name: "*"
        rule:
          requireSigned: false
          allowUnsigned: true
      - name: develop
        rule:
          requireSigned: false
          allowUnsigned: true
