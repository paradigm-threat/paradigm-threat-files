name: paradigm-threat-files
version: "0.1.0"
tools:
  search_site:
    description: Keyword AND search over the Relay SQLite content index. Prefer a short stem (iran, not iran iranian). Overlapping forms are collapsed. Default 20 slim hits (path/title/keywords).
    aliases: [search]
    via: query
    collection: index
  get_site_claims:
    description: Match curated thesis cards in site-claims.json
    via: json_match
    source: site-claims.json
  research_status:
    description: Coverage envelope — corpus hits vs gaps for a question (QUERY-backed)
    via: research_status
    collection: index
  read_article:
    description: Read a markdown (or other) blob by repo-relative path
    aliases: [fetch]
    via: git_read
