themes:
  light:
    variables:
      bg: "#f8fafc"
      foreground: "#0f172a"
      card: "#ffffff"
      muted: "#64748b"
      primary: "#2563eb"
      primaryFg: "#f8fafc"
      secondary: "#f1f5f9"
